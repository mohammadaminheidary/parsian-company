<li class="group/reason relative min-w-0 border-s border-on-dark/15 max-sm:nth-[2n+1]:border-transparent sm:max-lg:nth-[3n+1]:border-transparent lg:first:border-transparent motion-safe:transition-[opacity,translate] motion-safe:duration-600 motion-safe:ease-out motion-safe:delay-(--reveal-delay) motion-safe:data-[reveal=pending]:translate-y-4 motion-safe:data-[reveal=pending]:opacity-0" data-why-reveal data-reason>
  <h3>
    <button type="button" class="flex w-full cursor-pointer flex-col items-center gap-3 rounded-sm px-2 py-1 text-center text-sm font-bold leading-7 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent sm:text-base" aria-expanded="false" aria-controls="why-{{ key }}-description" aria-describedby="why-{{ key }}-description" data-reason-trigger>
      <span class="flex size-14 items-center justify-center rounded-full bg-primary/15 text-on-dark transition-colors duration-200 group-data-[popup=open]/reason:bg-primary/30 group-data-[popup=open]/reason:text-accent motion-reduce:transition-none sm:size-16" aria-hidden="true">
        <svg class="size-8 sm:size-9" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
          {% if key == 'quality' %}
            <path d="m4 11 5-6h14l5 6-12 17L4 11Zm0 0h24M9 5l3 6 4-6 4 6 3-6M12 11l4 17 4-17"/>
          {% elif key == 'materials' %}
            <path d="m3 10 13-7 13 7-13 7-13-7Zm0 6 13 7 13-7M3 22l13 7 13-7M9 13l14-7"/>
          {% elif key == 'sizing' %}
            <rect x="3" y="10" width="26" height="12" rx="2" transform="rotate(45 16 16)"/><path d="m10 8 4 4m0 0 2-2m-2 6 2-2m2 6 2-2m2 6 2-2"/>
          {% elif key == 'installation' %}
            <path d="m13 3-.7 4-2.6 1.5L6 7l-3 5 3.1 2.5v3L3 20l3 5 3.7-1.5 2.6 1.5.7 4h6l.7-4 2.6-1.5L26 25l3-5-3.1-2.5v-3L29 12l-3-5-3.7 1.5L19.7 7 19 3h-6Z"/><circle cx="16" cy="16" r="5"/>
          {% elif key == 'consultation' %}
            <path d="M25 18a10 10 0 0 0 1-4C26 8.5 21.1 4 15 4S4 8.5 4 14c0 2.5 1 4.7 2.6 6.4L5 26l6.4-2.6c1.1.4 2.3.6 3.6.6 1.8 0 3.5-.4 5-1.1M13 27a12 12 0 0 0 10.2.4L29 29l-1.5-5.1A10.3 10.3 0 0 0 29 17c-.3-1.7-1-3.2-2-4.5"/><circle cx="11" cy="13" r=".8"/><circle cx="19" cy="13" r=".8"/><path d="M10 17c3 2 7 2 10 0"/>
          {% elif key == 'pricing' %}
            <ellipse cx="21" cy="7" rx="7" ry="3"/><path d="M14 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7m-14 5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5m-9 8v5c1 .3 2 .4 3 .4 3.3 0 6-1.2 6-2.9V17"/><ellipse cx="10" cy="18" rx="7" ry="3"/><path d="M3 18v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5M3 23v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>
          {% endif %}
        </svg>
      </span>
      <span>{{ line1 }}<br>{{ line2 }}</span>
    </button>
  </h3>
  <div id="why-{{ key }}-description" role="tooltip" aria-hidden="true" class="pointer-events-none invisible absolute -inset-x-2 bottom-full z-20 translate-y-2 pb-3 opacity-0 transition-[opacity,translate,visibility] duration-200 group-data-[popup=open]/reason:pointer-events-auto group-data-[popup=open]/reason:visible group-data-[popup=open]/reason:translate-y-0 group-data-[popup=open]/reason:opacity-100 motion-reduce:translate-none motion-reduce:transition-none after:absolute after:bottom-2 after:left-1/2 after:size-2 after:-translate-x-1/2 after:rotate-45 after:bg-navy" data-reason-popup>
    <p class="rounded-lg border border-accent/25 bg-navy px-3 py-3 text-center text-[13px] font-light leading-6 text-on-dark/90">{{ description }}</p>
  </div>
</li>
