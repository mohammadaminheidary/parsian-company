{% load static %}
{% static 'images/' as images_url %}
<li class="group min-w-0 border-b border-navy/10 py-1.5 last:border-0 motion-safe:transition-[opacity,translate] motion-safe:duration-500 motion-safe:ease-out motion-safe:delay-(--reveal-delay) motion-safe:data-[reveal=pending]:translate-y-3 motion-safe:data-[reveal=pending]:opacity-0 md:border-0 md:py-0" data-product-reveal>
  <article class="grid h-full grid-cols-[34%_minmax(0,1fr)] items-center gap-3 md:grid-cols-1 md:grid-rows-[auto_1fr] md:items-stretch md:gap-0 md:overflow-hidden md:rounded-md md:bg-surface md:ring-1 md:ring-navy/5 motion-safe:md:transition-[translate] motion-safe:md:duration-300 motion-safe:md:ease-out motion-safe:md:group-hover:-translate-y-1">
    <img class="aspect-7/4 w-full rounded-xl object-cover {{ focal }} md:aspect-[4/3] md:rounded-none" src="{{ images_url }}products/{{ image }}-400.webp" srcset="{{ images_url }}products/{{ image }}-400.webp 400w, {{ images_url }}products/{{ image }}.webp 768w" sizes="(min-width: 1600px) 269px, (min-width: 1280px) calc((100vw - 256px) / 5), (min-width: 1024px) calc((100vw - 192px) / 5), (min-width: 768px) calc((100vw - 128px) / 5), 34vw" width="400" height="267" alt="{{ alt }}" loading="lazy" decoding="async">
    <div class="flex min-w-0 items-start gap-2 text-start md:min-h-[90px] md:justify-center md:px-2 md:py-3 md:text-center">
      <span class="mt-0.5 size-[clamp(1.55rem,6.8vw,2.3rem)] shrink-0 text-primary-strong md:hidden">
        {% include 'includes/product-icon.html' with icon=image only %}
      </span>
      <div class="min-w-0">
        <h3 class="text-[clamp(.8rem,3.45vw,1.125rem)] leading-snug font-bold text-navy md:text-sm">{{ title }}{% if code %} <bdi lang="en">{{ code }}</bdi>{% endif %}</h3>
        <p class="mt-1 text-[clamp(.7rem,2.9vw,1rem)] leading-snug font-light text-ink/85 md:text-xs">{{ description }}</p>
      </div>
    </div>
  </article>
</li>
