{% load static %}
<li class="row-span-3 grid min-w-0 grid-rows-subgrid snap-start motion-safe:transition-[opacity,translate] motion-safe:duration-600 motion-safe:ease-out motion-safe:delay-(--reveal-delay) motion-safe:data-[reveal=pending]:translate-y-4 motion-safe:data-[reveal=pending]:opacity-0" data-product-item>
  <article class="row-span-3 grid min-w-0 grid-rows-subgrid text-right transition-transform duration-300 ease-out hover:-translate-y-1.5 motion-reduce:transform-none motion-reduce:translate-none motion-reduce:transition-none" dir="rtl">
    <img class="aspect-[5/4] w-full rounded-sm object-cover [clip-path:polygon(16%_0,100%_0,84%_100%,0_100%)]" src="{% static 'images/products/' %}{{ image }}.webp" srcset="{% static 'images/products/' %}{{ image }}-400.webp 400w, {% static 'images/products/' %}{{ image }}.webp 800w" sizes="(min-width: 1600px) 304px, (min-width: 768px) 19vw, 62vw" width="800" height="640" alt="{{ alt }}" loading="lazy" decoding="async">
    <h3 class="mt-3 min-w-0 ps-[16%] pe-1 text-[15px] font-bold leading-7 whitespace-normal text-navy md:text-sm lg:text-[15px] xl:text-base">{{ title }}{% if code %} <bdi lang="en">{{ code }}</bdi>{% endif %}</h3>
    <p class="mt-1 min-w-0 ps-[16%] pe-1 text-sm font-light leading-6 text-ink/75">{{ description }}</p>
  </article>
</li>
