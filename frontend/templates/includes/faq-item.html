<div class="group/faq border-b border-on-dark/18" data-faq-item>
  <h3>
    <button id="faq-trigger-{{ key }}" class="flex min-h-13 w-full cursor-pointer items-center justify-between gap-5 py-3 text-start text-sm font-light leading-7 transition-colors duration-200 hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none" type="button" aria-expanded="true" aria-controls="faq-answer-{{ key }}" data-faq-trigger disabled>
      <span>{{ question }}</span>
      <span class="relative size-4 shrink-0 text-on-dark/90" aria-hidden="true">
        <svg class="absolute inset-0 size-full transition-[opacity,rotate,scale] duration-350 ease-out group-data-[open=true]/faq:rotate-90 group-data-[open=true]/faq:scale-75 group-data-[open=true]/faq:opacity-0 motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <svg class="absolute inset-0 size-full -rotate-90 scale-75 opacity-0 transition-[opacity,rotate,scale] duration-350 ease-out group-data-[open=true]/faq:rotate-0 group-data-[open=true]/faq:scale-100 group-data-[open=true]/faq:opacity-100 motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </span>
    </button>
  </h3>
  <div id="faq-answer-{{ key }}" class="grid" role="region" aria-labelledby="faq-trigger-{{ key }}" data-faq-panel>
    <div class="min-h-0 overflow-hidden">
      <p class="pb-5 pe-9 text-sm font-light leading-8 text-on-dark/80">{{ answer }}</p>
    </div>
  </div>
</div>
