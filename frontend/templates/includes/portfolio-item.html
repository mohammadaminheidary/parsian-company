{% load static %}
<li class="group/project w-[calc(100vw_-_5rem)] min-w-0 shrink-0 snap-center sm:w-[calc(100vw_-_12rem)] md:w-auto" data-portfolio-item data-category="{{ category }}" data-portfolio-reveal>
  <article data-portfolio-card class="origin-top data-[active=false]:scale-95 transition-[scale,translate] duration-300 ease-in-out group-hover/project:-translate-y-1 motion-reduce:transform-none motion-reduce:translate-none motion-reduce:transition-none">
    <img class="aspect-[4/3] w-full rounded-sm object-cover" src="{% static 'images/' %}{{ image }}.webp" srcset="{% static 'images/' %}{{ image }}-400.webp 400w, {% static 'images/' %}{{ image }}.webp 800w" sizes="(min-width: 1600px) 269px, (min-width: 1280px) calc((100vw - 256px) / 5), (min-width: 1024px) calc((100vw - 192px) / 5), (min-width: 768px) calc((100vw - 128px) / 5), (min-width: 640px) calc(100vw - 192px), calc(100vw - 80px)" width="800" height="600" alt="{{ alt }}" loading="lazy" decoding="async">
    <div class="mt-3 text-right">
      <h3 class="text-[13px] font-bold leading-6 text-ink xl:text-[15px]">{{ title }}</h3>
      <p class="mt-0.5 text-xs font-light leading-6 text-muted">{{ caption }}</p>
      {# Project detail pages are not implemented; keep this text non-interactive. #}
      <span class="relative mt-1 inline-block text-xs font-medium leading-6 text-primary after:absolute after:start-0 after:bottom-0 after:h-px after:w-full after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-300 after:ease-in-out hover:after:scale-x-100 motion-reduce:after:transition-none">جزئیات بیشتر</span>
    </div>
  </article>
</li>
